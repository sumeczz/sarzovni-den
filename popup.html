<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <title>Šaržovní den</title>
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="css/menu.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">Š</span>
        <div>
          <p class="eyebrow">POMOCNÍK DO SKLADU</p>
          <h1>Šaržovní den</h1>
        </div>
      </div>
      <p class="date" id="date"></p>
      <div data-app-menu></div>
    </header>

    <main>
      <section class="hero-card" aria-label="Generátor šaržovního dne">
        <div class="section-kicker"><span class="live-dot"></span> HLAVNÍ GENERÁTOR</div>
        <p class="hero-hint">Zadej verzi plechu. Den a rok doplníme automaticky.</p>
      <section class="code-line" aria-labelledby="code">
        <span class="code-prefix" aria-hidden="true">Verze:</span>
        <span class="code" id="code">
          <input
            id="version"
            class="code-version"
            type="text"
            placeholder="verze"
            aria-label="Verze"
            title="Verze (v SAPu šarže dodavatele)"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
          /><span class="code-day" id="code-day">000</span
          ><span class="code-year" id="code-year">0</span>
        </span>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="barcode" id="barcode-panel">
        <div class="barcode-image" id="barcode"></div>
        <p class="barcode-caption" id="barcode-caption"></p>
      </div>

      <div class="actions">
        <button type="button" class="button primary" id="copy">Kopírovat kód</button>
        <button type="button" class="button" id="print">Tisk</button>
        <button type="button" class="button" id="big">Velký kód</button>
        <button type="button" class="button" id="save">Uložit</button>
      </div>
      </section>

      <section class="panel">
        <button type="button" class="panel-toggle" id="multi-toggle" aria-expanded="true" aria-controls="multi-body">
          <span>Více kódů</span>
          <span class="panel-summary" id="multi-count"></span>
        </button>

        <div class="panel-body" id="multi-body">
          <input
            id="multi-versions"
            class="input"
            type="text"
            placeholder="verze oddělené mezerou, např. 12472A 12472B"
            aria-label="Verze pro více kódů"
            autocomplete="off"
            spellcheck="false"
          />
          <p class="status" id="multi-info" role="status" aria-live="polite"></p>
          <div class="actions">
            <button type="button" class="button" id="multi-copy">Kopírovat vše</button>
            <button type="button" class="button" id="multi-save">Uložit vše</button>
            <button type="button" class="button primary" id="multi-print">Tisk</button>
          </div>
        </div>
      </section>

      <section class="panel" hidden>
        <button type="button" class="panel-toggle" id="print-toggle" aria-expanded="false" aria-controls="print-config">
          <span>Tisk štítku</span>
          <span class="panel-summary" id="print-summary"></span>
        </button>

        <div class="panel-body" id="print-config" hidden>
          <div class="panel-row">
            <label class="panel-field">
              <span>Šířka štítku (mm)</span>
              <input type="number" id="label-width" min="20" max="200" step="1" />
            </label>

            <label class="panel-field">
              <span>Kusů na kód</span>
              <input type="number" id="label-copies" min="1" max="200" step="1" value="1" />
            </label>
          </div>

          <div class="presets" id="presets"></div>

          <p class="status" id="print-info" role="status" aria-live="polite"></p>

          <div class="panel-actions">
            <button type="button" class="button small" id="fix-width" hidden></button>
          </div>
        </div>
      </section>

      <section class="panel" hidden>
        <button type="button" class="panel-toggle" id="tools-toggle" aria-expanded="false" aria-controls="tools-body">
          <span>Další generátor · Code 128</span>
          <span class="panel-summary">libovolný text</span>
        </button>
        <div class="panel-body" id="tools-body" hidden>
          <label class="tool-label" for="tool-text">Text pro čárový kód</label>
          <input id="tool-text" class="input" type="text" maxlength="80" placeholder="Např. interní kód nebo číslo materiálu" autocomplete="off" spellcheck="false" />
          <div class="tool-preview" id="tool-preview"><span>Zadej text pro náhled</span></div>
          <p class="status" id="tool-info" role="status" aria-live="polite">Code 128 podporuje běžné ASCII znaky.</p>
          <div class="actions tool-actions">
            <button type="button" class="button" id="tool-copy" disabled>Kopírovat text</button>
            <button type="button" class="button primary" id="tool-download" disabled>Stáhnout SVG</button>
          </div>
        </div>
      </section>

    </main>

    <section class="history">
      <button type="button" class="history-toggle" id="history-toggle" aria-expanded="false" aria-controls="history-body">
        <span>Historie</span>
        <span class="history-count" id="history-count">0</span>
      </button>

      <div class="history-body" id="history-body" hidden>
        <input id="search" class="input" type="search" placeholder="Hledat v historii" aria-label="Hledat v historii" />
        <ul class="history-list" id="history-list"></ul>
        <p class="history-empty" id="history-empty" hidden>Zatím nic uloženého.</p>
        <div class="history-footer">
          <span class="hint">Kliknutí na záznam ho doplní do pole.</span>
          <button type="button" class="link" id="clear">Vymazat vše</button>
        </div>
      </div>
    </section>

    <script type="module" src="js/menu.js"></script>
    <script type="module" src="js/popup.js"></script>
  </body>
</html>
